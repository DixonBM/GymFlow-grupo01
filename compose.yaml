services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    environment:
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0}"
      MONGODB_DB: "${MONGODB_DB:-gymflow}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-60}"
      APP_ENV: "${APP_ENV:-local}"
      APP_URL: "${APP_URL:-http://localhost:8000/}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_AUTH: "${SMTP_AUTH:-false}"
      SMTP_ENCRYPTION: "${SMTP_ENCRYPTION:-none}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-no-reply@gymflow.test}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-GymFlow}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - gymflow_mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; quit(db.adminCommand({hello:1}).isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  gymflow_mongo:
