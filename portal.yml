nombre: GymFlow
resumen: >-
  Aplicación web de código abierto para gestionar varios gimnasios desde un
  mismo sistema. Permite administrar socios, planes, membresías, pagos
  manuales e inventario de máquinas.
problema: >-
  Los gimnasios pequeños suelen llevar el control de sus socios, vencimientos
  y cobros en registros dispersos. GymFlow centraliza esa información y
  separa los datos de cada gimnasio.
usuarios: Superadministradores de la plataforma y administradores de gimnasios
motores: [MongoDB, Redis]
lenguaje: PHP
licencia: MIT
repositorio: https://github.com/DixonBM/GymFlow-grupo01
